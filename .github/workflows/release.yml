name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish Framework-Dependent Single-File (win-x64)
        run: |
          dotnet publish SlotboundTrainer.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
            -o dist/framework-dependent
          Compress-Archive -Path dist/framework-dependent/* -DestinationPath SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip -Force

      - name: Publish Self-Contained Single-File (win-x64)
        run: |
          dotnet publish SlotboundTrainer.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false `
            -o dist/self-contained
          Compress-Archive -Path dist/self-contained/* -DestinationPath SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SlotboundTrainer ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Slotbound 纯内存修改器 ${{ github.ref_name }}

            面向 **Slotbound**（LÖVE 11.5 / LuaJIT 2.1 GC64 x64）的纯外部内存修改器，绝不修改任何游戏文件，不注入 DLL。

            ### 下载说明
            - **`SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip`**（推荐）：独立自包含单文件版，解压即用，无需安装 .NET 运行时。
            - **`SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip`**：轻量版（需本机已安装 .NET 6 Desktop Runtime）。

            ### 主要功能
            - 资源修改与定时锁定：金币、精华、剩余旋转、免费旋转次数、核心免费重掷、基地生命、本局源石
            - 实用开关：免费无限付费旋转、商店免费重掷、老虎机每次必中、战斗我方无敌、敌人自动残血 (1 HP)
            - 概率修改：普通/高级/稀有/传说/棱彩出率、老虎机强制中奖概率、六大职业符号权重
            - 单位属性：全员倍率强化 + 选中单位精准修改
          files: |
            SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip
            SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip
