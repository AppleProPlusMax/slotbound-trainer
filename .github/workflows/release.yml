name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Publish Framework-Dependent Single-File (win-x64)
        run: |
          dotnet publish SlotboundTrainer.csproj -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false `
            -o dist/framework-dependent
          Compress-Archive -Path dist/framework-dependent/* -DestinationPath SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip -Force

      - name: Publish Self-Contained Single-File (win-x64)
        run: |
          dotnet publish SlotboundTrainer.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false `
            -o dist/self-contained
          Compress-Archive -Path dist/self-contained/* -DestinationPath SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SlotboundTrainer ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## SlotboundTrainer ${{ github.ref_name }} (中文 / English)

            Pure external memory trainer for **Slotbound** (LÖVE 11.5 / LuaJIT 2.1 GC64 x64) — zero file edits, zero DLL injection.
            面向 **Slotbound** 的纯外部内存修改器，绝不修改任何游戏文件，不注入 DLL，支持一键实时中英文切换。

            ### Downloads / 下载说明
            - **`SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip`** *(Recommended / 推荐)*: Self-contained single-file executable, no .NET runtime required. 独立自包含单文件版，解压即用。
            - **`SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip`**: Lightweight build (requires .NET 6 Desktop Runtime). 轻量单文件版。

            ### Highlights / 主要功能
            - Live Chinese / English UI switcher (`EN` / `中文`) · 一键实时中英文切换
            - Resources & Freezes: Gold, Essence, Spins Left, Free Spins, Core Rerolls, Base HP, Run Originite
            - Cheats: Free Unlimited Paid Spins, Free Shop Reroll, Guaranteed Slot Win, Ally God Mode, One-Hit Enemies (1 HP)
            - Drop Rates: Rarity Probabilities (Normal / Advanced / Rare / Legendary / Prism), Forced Slot Win Rate, 6 Class Symbol Weights
            - Roster Units: Bulk ATK/HP/ASPD boosts + live-synced single-unit editor
          files: |
            SlotboundTrainer-${{ github.ref_name }}-win-x64-standalone.zip
            SlotboundTrainer-${{ github.ref_name }}-win-x64-net6.zip
